<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Notas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Portal de notas</h1>
    <p>Seja bem-vindo ao Portal de Notas!</p>
  </header>

  <main>
    <section class="cartoes">
      <div class="cartao">
        <span>Total de alunos</span>
        <strong id="totalAlunos">0</strong>
      </div>
      <div class="cartao">
        <span>Quantidade de notas</span>
        <strong id="totalNotas">0</strong>
      </div>
      <div class="cartao">
        <span>Notas acima de 7</span>
        <strong id="totalAcima">0</strong>
      </div>
      <div class="cartao">
        <span>Média da turma</span>
        <strong id="mediaTurma">-</strong>
      </div>
    </section>

    <section class="painel">
      <h2>Cadastrar aluno</h2>
      <div class="formulario">
        <div class="campo">
          <label for="nomeAluno">Nome do aluno</label>
          <input type="text" id="nomeAluno" placeholder="Ex.: Ana Souza">
        </div>
      </div>
      <p id="msgAluno" class="mensagem"></p>
      <div class="botoes">
        <button type="button" id="btnCadastrar" class="principal">Cadastrar aluno</button>
      </div>
    </section>

    <section class="painel">
      <h2>Adicionar nota</h2>
      <div class="formulario">
        <div class="campo">
          <label for="alunoSelect">Aluno</label>
          <select id="alunoSelect">
            <option value="">Selecione um aluno</option>
          </select>
        </div>
        <div class="campo">
          <label for="nota">Nota (0 a 10)</label>
          <input type="number" id="nota" min="0" max="10" step="0.1" placeholder="Ex.: 8.5">
        </div>
      </div>
      <p id="mensagem" class="mensagem"></p>
      <div class="botoes">
        <button type="button" id="btnAdicionar" class="principal">Adicionar nota</button>
        <button type="button" id="btnCalcular">Calcular média</button>
        <button type="button" id="btnLimpar">Limpar dados</button>
      </div>
    </section>

    <section class="painel">
      <h2>Resultados</h2>
      <div class="tabela-area">
        <table>
          <thead>
            <tr>
              <th>Aluno</th>
              <th>Notas</th>
              <th>Média</th>
              <th>Notas acima de 7</th>
            </tr>
          </thead>
          <tbody id="tabela"></tbody>
        </table>
      </div>
    </section>

    <section class="painel">
      <h2>Gráfico de médias</h2>
      <div id="grafico" class="grafico"></div>
    </section>
  </main>

  <footer>
    <p>Calculadora de Notas - Projeto escolar</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
